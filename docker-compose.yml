services:
  backend:
    build:
      context: ./backend
    # Docker-outside-of-Docker: the backend runs *inside* this container but
    # must still build/start sandbox containers via the host's Docker daemon
    # (paths in bind mounts are resolved by that daemon against the host
    # filesystem — this is what makes DooD work transparently for uploaded
    # repo paths).
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Mirror-mounted at the same path as on the host, scoped to just the
      # uploads directory (not the whole home directory) — uploaded repo
      # paths must resolve both when the backend itself stats the path (this
      # mount) AND when the host's Docker daemon bind-mounts it into a
      # sandbox container (via the socket above, which always resolves paths
      # against the host, not this container). The app is uploads-only now
      # (ALLOW_ARBITRARY_REPO_PATH=false below), so this is the only
      # directory the backend ever needs to see.
      - ${HOME}/.refactor-agent-uploads:${HOME}/.refactor-agent-uploads
    env_file:
      - ./backend/.env
    environment:
      # Docker Desktop only: lets the containerized backend reach the host's
      # natively-running Ollama instance (kept off Docker for GPU speed —
      # Docker Desktop on macOS has no Metal/GPU passthrough).
      OLLAMA_API_BASE: http://host.docker.internal:11434
      # The container's own $HOME (e.g. /root) isn't the host's — uploads
      # need to land under the host's real home dir so the mirror mount
      # above and the host Docker daemon's bind-mount both see the same path.
      HOST_HOME: ${HOME}
      # Overrides config.py's localhost default — inside this container,
      # "localhost" would mean the backend container itself, not the db service.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/refactor_agent
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: refactor_agent
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---- Reserved for Phase 2 ----
  # chroma:
  #   image: chromadb/chroma:latest
  #   ports:
  #     - "8001:8000"
  #   volumes:
  #     - chroma_data:/chroma/chroma

  # Ollama runs natively on the host per the local-default-stack decision;
  # not containerized here to avoid duplicate GPU/model-cache setups and to
  # keep Metal GPU acceleration on macOS (Docker Desktop can't pass it through).
  # ollama:
  #   image: ollama/ollama:latest
  #   ports:
  #     - "11434:11434"

volumes:
  db_data:
# chroma_data:
