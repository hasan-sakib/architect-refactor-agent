services:
  backend:
    build:
      context: ./backend
    # Docker-outside-of-Docker: the backend runs *inside* this container but
    # must still build/start sandbox containers via the host's Docker daemon
    # (paths in bind mounts, e.g. a target repo's host path, are resolved by
    # that daemon against the host filesystem — this is what makes DooD work
    # transparently for repo_path values the user enters in the UI).
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Mirror-mounted at the same path as on the host: repo_path values the
      # user enters (e.g. /Users/you/some-repo) must resolve both when the
      # backend itself stats the path (this mount) AND when the host's Docker
      # daemon bind-mounts it into a sandbox container (via the socket above,
      # which always resolves paths against the host, not this container).
      - ${HOME}:${HOME}
    env_file:
      - ./backend/.env
    environment:
      # Docker Desktop only: lets the containerized backend reach the host's
      # natively-running Ollama instance (kept off Docker for GPU speed —
      # Docker Desktop on macOS has no Metal/GPU passthrough).
      OLLAMA_API_BASE: http://host.docker.internal:11434
      # The container's own $HOME (e.g. /root) isn't the host's — uploads
      # need to land under the host's real home dir so the mirror mount
      # above and the host Docker daemon's bind-mount both see the same path.
      HOST_HOME: ${HOME}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  # ---- Reserved for Phase 2 ----
