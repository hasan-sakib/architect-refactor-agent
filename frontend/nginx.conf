server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Same-origin proxy to the backend — the browser only ever talks to
    # this nginx origin, so no CORS is needed for the dockerized setup.
    # No path after the host:port below is intentional: nginx then forwards
    # the original request URI unchanged (/api/tasks stays /api/tasks).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";

        # SSE support: streaming responses must not be buffered or cut off
        # by an idle timeout — task runs can take minutes.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;

        # nginx defaults to 1m — a real project folder upload (/api/uploads)
        # blows past that instantly. 128m leaves headroom over the backend's
        # own MAX_UPLOAD_BYTES (100 MiB, see backend/app/core/config.py) for
        # multipart boundary overhead — sized for a public multi-tenant
        # deployment, not the generous local-tool ceiling this used to be.
        client_max_body_size 128m;
    }
}
